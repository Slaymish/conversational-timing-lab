[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turntiming"
version = "0.1.0"
description = "Experiments in conversational turn-end and response-onset prediction"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
